org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
kotlin.code.style=official

# --- Project identity (change these first when you create a project from the template) ---
app.name=KotlinDesktopTemplate
app.group=com.example.app
# jpackage rejects a 0.x.y version for .dmg/.pkg, so start at 1.0.0. CI can override it with -Papp.version=...
app.version=1.0.0
app.vendor=Example
app.description=Kotlin desktop app template (Compose Desktop on Skiko)
app.copyright=Copyright (c) 2026 Example

# GitHub repository the auto-updater reads releases from: https://github.com/<owner>/<repo>/releases
github.owner=your-github-user
github.repo=kotlin-desktop-template
